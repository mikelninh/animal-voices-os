name: Android overlay APK · private prototype
on:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    name: Compile, run offline unit tests, publish installable debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests and debug APK
        run: gradle -p native-android --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload installable APK (not Play Store approved)
        uses: actions/upload-artifact@v4
        with:
          name: animal-voices-instagram-android-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
