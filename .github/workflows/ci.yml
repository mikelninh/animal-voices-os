name: Editorial quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JS syntax
        run: |
          node --check app.js
          node --check data.js
          node --check server.cjs
      - name: Run editorial and UI-contract tests
        run: npm test
