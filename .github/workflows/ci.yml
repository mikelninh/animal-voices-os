name: Editorial quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JS syntax
        run: |
          node --check app.js
          node --check data.js
          node --check server.cjs
      - name: Run editorial and UI-contract tests
        run: npm test
      - name: Package reviewable UI source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-voices-ui-source
          path: |
            index.html
            styles.css
            app.js
            data.js
            package.json
            server.cjs
            characters/**
