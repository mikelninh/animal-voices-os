name: Animal Voices editorial quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax
        run: |
          node --check app.js
          node --check engine.js
          node --check triage.js
          node --check sw.js
          node --check data.js
          node --check api/assist.js
          node --check server.cjs
      - name: Test editorial claims and safety
        run: npm test
